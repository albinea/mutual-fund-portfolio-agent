version: "v2"
description: >-
  Retrieval-grounding regression suite using facts verified in the checked-in
  HDFC August 2026 factsheet chunks. Page 64 is retained as a wrong-fund
  distractor for the HDFC Medium to Long Term Fund queries.
corpus:
  documents:
    - document: "HDFC MF Factsheet - August 2026.pdf"
      pages: [63, 64, 86, 87]

questions:
  - id: Q01
    fund_scope: "HDFC Medium to Long Term Fund"
    question: "What is the investment objective of HDFC Medium to Long Term Fund?"
    expected_document: "HDFC MF Factsheet - August 2026.pdf"
    expected_page: 86
    expected_evidence_terms: ["generate income", "capital appreciation", "debt and money market instruments"]
    expected_answer_terms: ["income", "capital appreciation", "debt", "money market"]

  - id: Q02
    fund_scope: "HDFC Medium to Long Term Fund"
    question: "What portfolio Macaulay duration range is stated for HDFC Medium to Long Term Fund?"
    expected_document: "HDFC MF Factsheet - August 2026.pdf"
    expected_page: 86
    expected_evidence_terms: ["Macaulay Duration of the Portfolio is between 4 years to 7 years"]
    expected_answer_patterns: ['(?i)4(?:\s+years)?\s*(?:to|and|[-–])\s*7\s+years']

  - id: Q03
    fund_scope: "HDFC Medium to Long Term Fund"
    question: "How does the factsheet classify the interest-rate and credit risks of HDFC Medium to Long Term Fund?"
    expected_document: "HDFC MF Factsheet - August 2026.pdf"
    expected_page: 86
    expected_evidence_terms: ["Relatively High Interest Rate Risk", "Moderate Credit Risk"]
    expected_answer_terms: ["High Interest Rate Risk", "Moderate Credit Risk"]

  - id: Q04
    fund_scope: "HDFC Medium to Long Term Fund"
    question: "What is the allotment or inception date of HDFC Medium to Long Term Fund?"
    expected_document: "HDFC MF Factsheet - August 2026.pdf"
    expected_page: 86
    expected_evidence_terms: ["September 11, 2000"]
    expected_answer_terms: ["September 11, 2000"]

  - id: Q05
    fund_scope: "HDFC Medium to Long Term Fund"
    question: "What was the August 31, 2026 NAV for the Regular Plan Growth Option of HDFC Medium to Long Term Fund?"
    expected_document: "HDFC MF Factsheet - August 2026.pdf"
    expected_page: 86
    expected_evidence_terms: ["Regular Plan - Growth Option", "60.4807"]
    expected_answer_terms: ["60.4807"]

  - id: Q06
    fund_scope: "HDFC Medium to Long Term Fund"
    question: "What was the August 31, 2026 NAV for the Direct Plan Growth Option of HDFC Medium to Long Term Fund?"
    expected_document: "HDFC MF Factsheet - August 2026.pdf"
    expected_page: 86
    expected_evidence_terms: ["Direct Plan - Growth Option", "67.3688"]
    expected_answer_terms: ["67.3688"]

  - id: Q07
    fund_scope: "HDFC Medium to Long Term Fund"
    question: "What was the scheme's average AUM for August 2026?"
    expected_document: "HDFC MF Factsheet - August 2026.pdf"
    expected_page: 86
    expected_evidence_terms: ["Average for Month of August, 2026", "834.46Cr"]
    expected_answer_terms: ["834.46"]

  - id: Q08
    fund_scope: "HDFC Medium to Long Term Fund"
    question: "What AUM does the factsheet report as of August 31, 2026?"
    expected_document: "HDFC MF Factsheet - August 2026.pdf"
    expected_page: 86
    expected_evidence_terms: ["As on August 31, 2026", "830.20Cr"]
    expected_answer_terms: ["830.20"]

  - id: Q09
    fund_scope: "HDFC Medium to Long Term Fund"
    question: "What residual maturity is reported for HDFC Medium to Long Term Fund?"
    expected_document: "HDFC MF Factsheet - August 2026.pdf"
    expected_page: 86
    expected_evidence_terms: ["Residual Maturity", "12.88 Years"]
    expected_answer_terms: ["12.88"]

  - id: Q10
    fund_scope: "HDFC Medium to Long Term Fund"
    question: "What Macaulay duration does the August 2026 factsheet report?"
    expected_document: "HDFC MF Factsheet - August 2026.pdf"
    expected_page: 86
